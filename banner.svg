    <text x="960" y="46" font-size="16" fill="#7ee0ff" text-anchor="end">B.TECH CSE  |  CLASS OF 2027</text>

    <text x="233" y="133" font-size="46" fill="#ff5e5b" letter-spacing="2">KOUSHAL KARTHIK RAO</text>
    <text x="230" y="130" font-size="46" fill="#ffd23f" letter-spacing="2">KOUSHAL KARTHIK RAO</text>

    <text x="230" y="168" font-size="20" fill="#7ee0ff">BACKEND ENGINEER  //  PYTHON - FASTAPI - NEXT.JS</text>

    <text x="230" y="208" font-size="20" fill="#ffffff">
      &gt; PRESS START
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.9;1" dur="1.6s" repeatCount="indefinite"/>
    </text>
    <text x="960" y="208" font-size="18" fill="#4cffa1" text-anchor="end">OPEN TO BACKEND INTERNSHIPS</text>
  </g>

