  <title id="t">Koushal Karthik Rao - Backend Engineer</title>
  <desc id="d">Retro pixel-art game title screen: a pixel developer sprite, the name Koushal Karthik Rao, the stack Python, FastAPI and Next.js, and a blinking press start prompt.</desc>
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.18"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14183a"/>
      <stop offset="1" stop-color="#0a0c1f"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="270" fill="url(#bg)"/>
  <rect x="6" y="6" width="988" height="258" fill="none" stroke="#3a7bff" stroke-width="4"/>
  <rect x="14" y="14" width="972" height="242" fill="none" stroke="#1f2a66" stroke-width="2"/>

  <g font-family="'Courier New','Lucida Console',monospace" font-weight="bold">
